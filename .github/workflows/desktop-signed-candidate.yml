name: Pi Orbit Desktop Signed Candidate

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: desktop-signed-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-main-ref:
    name: Require validated main commit
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Reject non-main dispatch
        run: test "$GITHUB_REF" = "refs/heads/main"

      - name: Require successful three-platform artifact run for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_count="$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/desktop-release-candidate.yml/runs?head_sha=$GITHUB_SHA&status=success&per_page=100" \
            --jq '.workflow_runs | length')"
          if [ "$run_count" -lt 1 ]; then
            echo "No successful three-platform artifact run found for $GITHUB_SHA" >&2
            exit 1
          fi

  package-sign-and-smoke:
    name: ${{ matrix.platform }} signed candidate
    needs: verify-main-ref
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.runner }}
    environment: desktop-signing
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-latest
            artifact_glob: packages/desktop/release/*.exe
          - platform: macos
            runner: macos-latest
            artifact_glob: packages/desktop/release/*.dmg
    steps:
      - name: Checkout reviewed main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Electron runtime and build node-pty
        shell: bash
        run: |
          node node_modules/electron/install.js
          npm rebuild node-pty --workspace=@earendil-works/pi-orbit

      - name: Build Pi runtime dependencies
        shell: bash
        run: |
          npm run build --workspace=@earendil-works/chord
          npm run build --workspace=@earendil-works/pi-tui
          npm run build --workspace=@earendil-works/pi-telemetry
          npm run build --workspace=@earendil-works/pi-codemode
          npm run build --workspace=@earendil-works/pi-mcp
          npm run hydrate-model-data --workspace=@earendil-works/pi-ai
          npm run build:offline --workspace=@earendil-works/pi-ai
          npm run build --workspace=@earendil-works/pi-agent-core
          npm run build --workspace=@earendil-works/pi-durable
          npm run build:unbundled --workspace=@earendil-works/pi-coding-agent

      - name: Typecheck desktop renderer
        run: npm run typecheck:renderer --workspace=@earendil-works/pi-orbit

      - name: Test desktop services and worker
        run: npm run test --workspace=@earendil-works/pi-orbit

      - name: Build desktop application
        run: npm run build --workspace=@earendil-works/pi-orbit

      - name: Sign and package Windows NSIS installer
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          WIN_CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          if (-not $env:WIN_CSC_LINK -or -not $env:WIN_CSC_KEY_PASSWORD) {
            throw 'Windows signing secrets are missing from desktop-signing'
          }
          npm run package:win --workspace=@earendil-works/pi-orbit
          if ($LASTEXITCODE -ne 0) { throw 'Windows packaging failed' }

      - name: Sign, notarize, and package macOS DMG
        if: matrix.platform == 'macos'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          for value in "$CSC_LINK" "$CSC_KEY_PASSWORD" "$APPLE_API_KEY_BASE64" "$APPLE_API_KEY_ID" "$APPLE_API_ISSUER"; do
            if [[ -z "$value" ]]; then
              echo 'macOS signing or notarization secrets are missing from desktop-signing' >&2
              exit 1
            fi
          done
          key_file="$RUNNER_TEMP/pi-orbit-notary-key.p8"
          trap 'rm -f "$key_file"' EXIT
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 -D > "$key_file"
          chmod 600 "$key_file"
          export APPLE_API_KEY="$key_file"
          npm run package:mac --workspace=@earendil-works/pi-orbit

      - name: Verify Windows installer signature
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem packages/desktop/release -Filter *.exe |
            Where-Object { $_.Name -notlike '*uninstaller*' } |
            Select-Object -First 1
          if ($null -eq $installer) { throw 'NSIS installer was not produced' }
          $signature = Get-AuthenticodeSignature -LiteralPath $installer.FullName
          if ($signature.Status -ne 'Valid') {
            throw "Installer signature is $($signature.Status)"
          }

      - name: Verify macOS app signature and stapled notarization ticket
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          dmg="$(find packages/desktop/release -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$dmg"
          mount_dir="$RUNNER_TEMP/pi-orbit-signed-dmg"
          mkdir -p "$mount_dir"
          hdiutil attach "$dmg" -readonly -nobrowse -mountpoint "$mount_dir"
          trap 'hdiutil detach "$mount_dir" -quiet' EXIT
          app="$(find "$mount_dir" -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv --verbose=4 "$app" 2>&1 | grep 'Authority=Developer ID Application:'
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose "$app"

      - name: Install, launch, and uninstall packaged app (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: ./test/smoke/windows-installed.ps1

      - name: Mount and launch packaged app from DMG (macOS)
        if: matrix.platform == 'macos'
        shell: bash
        run: bash test/smoke/macos-installed.sh

      - name: Create SHA-256 manifest (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem packages/desktop/release -Filter *.exe |
            Where-Object { $_.Name -notlike '*uninstaller*' } |
            Select-Object -First 1
          if ($null -eq $installer) { throw 'NSIS installer was not produced' }
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer.FullName).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content -Encoding ascii packages/desktop/release/SHA256SUMS

      - name: Create SHA-256 manifest (macOS)
        if: matrix.platform == 'macos'
        shell: bash
        run: cd packages/desktop/release && shasum -a 256 -- *.dmg > SHA256SUMS

      - name: Upload signed candidate and checksum
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pi-orbit-signed-${{ matrix.platform }}-${{ github.sha }}
          path: |
            ${{ matrix.artifact_glob }}
            packages/desktop/release/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
